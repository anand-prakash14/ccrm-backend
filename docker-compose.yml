version: '3.9'

# Local dev datastores only for this story (CA-137). Full app containerization
# (CRM API / Web Frontend / Agents module services) is delivered under CA-141.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccrm
      POSTGRES_PASSWORD: ccrm
      POSTGRES_DB: ccrm
    ports:
      - '5432:5432'
    volumes:
      - ccrm_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ccrm -d ccrm']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ccrm_postgres_data:
